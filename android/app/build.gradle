apply plugin: 'com.android.application'

// ── Release signing ─────────────────────────────────────────────────────────
// Credentials come from android/keystore.properties (local, git-ignored) or from
// environment variables (CI). Never from this file — it is committed.
//
// Local:  cp keystore.properties.example keystore.properties  (then fill it in)
// CI:     set ANDROID_KEYSTORE_PATH / _PASSWORD / _ALIAS / _KEY_PASSWORD
def keystorePropsFile = rootProject.file('keystore.properties')
def releaseSigning = [:]

if (keystorePropsFile.exists()) {
    def props = new Properties()
    keystorePropsFile.withInputStream { props.load(it) }
    releaseSigning = [
        storeFile    : props['storeFile'],
        storePassword: props['storePassword'],
        keyAlias     : props['keyAlias'],
        keyPassword  : props['keyPassword'],
        source       : 'keystore.properties',
    ]
} else if (System.getenv('ANDROID_KEYSTORE_PATH')) {
    releaseSigning = [
        storeFile    : System.getenv('ANDROID_KEYSTORE_PATH'),
        storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
        keyAlias     : System.getenv('ANDROID_KEYSTORE_ALIAS'),
        keyPassword  : System.getenv('ANDROID_KEYSTORE_KEY_PASSWORD'),
        source       : 'environment',
    ]
}

def hasReleaseKeystore = releaseSigning && releaseSigning.storeFile &&
        rootProject.file(releaseSigning.storeFile).exists()

android {
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile     rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias      releaseSigning.keyAlias
                keyPassword   releaseSigning.keyPassword
            }
        }
    }
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.adityaraj.sbpdcl"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            // No else: a release build with no keystore stays UNSIGNED rather than
            // silently falling back to the debug key. A debug-signed "release" is
            // rejected by Play and can be re-signed by anyone, and the old config
            // made that the default — easy to ship by accident.
        }
    }

    namespace = "com.adityaraj.sbpdcl"
}

// Say plainly which key a release is being built with — an unsigned or
// wrongly-signed APK is otherwise only discoverable after the fact.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        if (hasReleaseKeystore) {
            println "[signing] release APK signed with ${releaseSigning.keyAlias} (from ${releaseSigning.source})"
        } else {
            println "[signing] WARNING: no release keystore found — the release APK will be UNSIGNED."
            println "[signing] Create android/keystore.properties (see keystore.properties.example)"
            println "[signing] or set ANDROID_KEYSTORE_PATH / _PASSWORD / _ALIAS / _KEY_PASSWORD."
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
